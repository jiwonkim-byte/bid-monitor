name: 시트 행 LLM 재분석

on:
  workflow_dispatch:
    inputs:
      row_numbers:
        description: '재분석할 시트 행 번호 (콤마 구분, 예: 138,298,742)'
        required: true

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run reanalyze
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ROW_NUMBERS: ${{ github.event.inputs.row_numbers }}
          PYTHONUTF8: '1'
        run: python reanalyze.py
